<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" contenido="width=device-width, initial-scale=1.0" />
  <title>Ver Registros — Panel Docker</title>
  <link rel="stylesheet" href="base.css" />
  <link rel="stylesheet" href="registros.css" />
</head>
<body>
  <header class="barra-superior">
    <div class="marca">
      <span class="logo">PD</span>
      <h1>Panel Docker</h1>
    </div>
    <div class="usuario">
      <span class="nombre-usuario">Hola, Juan</span>
      <div class="avatar">J</div>
      <button class="enlace-salir" data-salir>Salir</button>
    </div>
  </header>

  <div class="estructura">
    <aside class="barra-lateral">
      <nav>
        <a href="perfiles.html" class="item-nav">Perfiles</a>
        <a href="crear-perfil.html" class="item-nav">Crear Perfil</a>
        <a href="registros.html" class="item-nav active">Ver Registros</a>
        <a href="ajustes.html" class="item-nav">Ajustes</a>
      </nav>
      <div class="caja-perfil">
        <p class="etiqueta-perfil">Perfil activo</p>
        <p class="nombre-perfil">Juan Pérez</p>
        <p class="pista-perfil">Bitácora real del servidor</p>
      </div>
    </aside>

    <main class="contenido">
      <section class="portada">
        <h2>Bitácora de administración</h2>
        <p class="subtitulo">Cada perfil creado o eliminado queda registrado aquí, con fecha y hora reales.</p>
      </section>

      <section class="panel">
        <div class="registros" id="cajaLogs" style="max-height:480px;"></div>
      </section>
    </main>
  </div>

  <footer class="footer">
    <p>Panel Docker · Consola de administración de perfiles reales</p>
  </footer>

  <div id="contenedorAvisos"></div>

  <script src="configuracion.js"></script>
  <script src="sesion.js"></script>
  <script src="utilidades.js"></script>
  <script>
    requiereSesion('index.html');
    pintarUsuarioEnBarra();
    activarBotonSalir('index.html');
    aplicarTemaGuardado();

    const cajaLogs = document.getElementById('cajaLogs');

    async function cargarRegistros() {
      cajaLogs.innerHTML = '<p>Cargando…</p>';
      try {
        const res = await fetch(`${URL_BASE}/api/registros`);
        const datos = await res.json();
        if (!datos.ok) throw new Error(datos.mensaje);
        mostrarRegistros(datos.registros);
      } catch (err) {
        cajaLogs.innerHTML = '<p>No se pudo conectar con el backend.</p>';
      }
    }

    function mostrarRegistros(registros) {
      cajaLogs.innerHTML = '';
      if (registros.length === 0) {
        cajaLogs.innerHTML = '<p>Sin registros todavía.</p>';
        return;
      }
      registros.forEach(registro => {
        const p = document.createElement('p');
        if (registro.type) p.className = `registro-${registro.type}`;
        const hora = new Date(registro.time).toLocaleString('es-MX');
        p.innerHTML = `<span class="registro-hora">${hora}</span> ${registro.text}`;
        cajaLogs.appendChild(p);
      });
    }

    cargarRegistros();
  </script>
</body>
</html>
