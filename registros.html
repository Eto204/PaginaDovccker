<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ver Registros — Panel Docker</title>
  <link rel="stylesheet" href="base.css" />
  <link rel="stylesheet" href="registros.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">PD</span>
      <h1>Panel Docker</h1>
    </div>
    <div class="user">
      <span class="user-name">Hola, Juan</span>
      <div class="avatar">J</div>
      <button class="logout-link" data-logout>Salir</button>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <nav>
        <a href="perfiles.html" class="nav-item">Perfiles</a>
        <a href="crear-perfil.html" class="nav-item">Crear Perfil</a>
        <a href="registros.html" class="nav-item active">Ver Registros</a>
        <a href="ajustes.html" class="nav-item">Ajustes</a>
      </nav>
      <div class="profile-box">
        <p class="profile-label">Perfil activo</p>
        <p class="profile-name">Juan Pérez</p>
        <p class="profile-hint">Bitácora real del servidor</p>
      </div>
    </aside>

    <main class="content">
      <section class="hero">
        <h2>Bitácora de administración</h2>
        <p class="subtitle">Cada perfil creado o eliminado queda registrado aquí, con fecha y hora reales.</p>
      </section>

      <section class="panel">
        <div class="logs" id="logsBox" style="max-height:480px;"></div>
      </section>
    </main>
  </div>

  <footer class="footer">
    <p>Panel Docker · Consola de administración de perfiles reales</p>
  </footer>

  <div id="toastContainer"></div>

  <script src="configuracion.js"></script>
  <script src="sesion.js"></script>
  <script src="utilidades.js"></script>
  <script>
    requireAuth('index.html');
    paintUserInTopbar();
    wireLogout('index.html');
    applyStoredTheme();

    const logsBox = document.getElementById('logsBox');

    async function loadLogs() {
      logsBox.innerHTML = '<p>Cargando…</p>';
      try {
        const res = await fetch(`${API_BASE}/api/logs`);
        const data = await res.json();
        if (!data.ok) throw new Error(data.message);
        renderLogs(data.logs);
      } catch (err) {
        logsBox.innerHTML = '<p>No se pudo conectar con el backend.</p>';
      }
    }

    function renderLogs(entries) {
      logsBox.innerHTML = '';
      if (entries.length === 0) {
        logsBox.innerHTML = '<p>Sin registros todavía.</p>';
        return;
      }
      entries.forEach(entry => {
        const p = document.createElement('p');
        if (entry.type) p.className = `log-${entry.type}`;
        const time = new Date(entry.time).toLocaleString('es-MX');
        p.innerHTML = `<span class="log-time">${time}</span> ${entry.text}`;
        logsBox.appendChild(p);
      });
    }

    loadLogs();
  </script>
</body>
</html>
