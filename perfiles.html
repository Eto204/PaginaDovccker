<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" contenido="width=device-width, initial-scale=1.0" />
  <title>Perfiles — Panel Docker</title>
  <link rel="stylesheet" href="base.css" />
  <link rel="stylesheet" href="perfiles.css" />
</head>
<body>
  <header class="barra-superior">
    <div class="marca">
      <span class="logo">PD</span>
      <h1>Panel Docker</h1>
    </div>
    <div class="usuario">
      <span class="nombre-usuario">Hola, Juan</span>
      <div class="avatar">J</div>
      <button class="enlace-salir" data-salir>Salir</button>
    </div>
  </header>

  <div class="estructura">
    <aside class="barra-lateral">
      <nav>
        <a href="perfiles.html" class="item-nav active">Perfiles</a>
        <a href="crear-perfil.html" class="item-nav">Crear Perfil</a>
        <a href="registros.html" class="item-nav">Ver Registros</a>
        <a href="ajustes.html" class="item-nav">Ajustes</a>
      </nav>
      <div class="caja-perfil">
        <p class="etiqueta-perfil">Perfil activo</p>
        <p class="nombre-perfil">Juan Pérez</p>
        <p class="pista-perfil">Perfiles reales del servidor</p>
      </div>
    </aside>

    <main class="contenido">
      <section class="portada">
        <h2>Perfiles del servidor</h2>
        <p class="subtitulo">Usuarios reales y el estado de su entorno aislado (Distrobox).</p>
      </section>

      <section class="tarjetas" id="contenedorTarjetas"></section>
    </main>
  </div>

  <footer class="footer">
    <p>Panel Docker · Consola de administración de perfiles reales</p>
  </footer>

  <div id="contenedorAvisos"></div>

  <script src="configuracion.js"></script>
  <script src="sesion.js"></script>
  <script src="utilidades.js"></script>
  <script>
    requiereSesion('index.html');
    pintarUsuarioEnBarra();
    activarBotonSalir('index.html');
    aplicarTemaGuardado();

    const ETIQUETA_ROL = { alumnos: 'Alumno', maestros: 'Maestro', admins: 'Admin' };
    const contenedorTarjetas = document.getElementById('contenedorTarjetas');

    async function cargarPerfiles() {
      contenedorTarjetas.innerHTML = '<p class="subtitulo">Cargando perfiles…</p>';
      try {
        const res = await fetch(`${URL_BASE}/api/profiles`);
        const datos = await res.json();
        if (!datos.ok) throw new Error(datos.mensaje);
        mostrarPerfiles(datos.profiles);
      } catch (err) {
        // no jaló la conexión, avisamos bonito en vez de
        // dejar la pantalla en blanco
        contenedorTarjetas.innerHTML = `<p class="subtitulo">No se pudo conectar con el backend. Revisa que esté corriendo y que la dirección en configuracion.js sea la correcta.</p>`;
      }
    }

    function mostrarPerfiles(perfiles) {
      contenedorTarjetas.innerHTML = '';
      if (perfiles.length === 0) {
        contenedorTarjetas.innerHTML = '<p class="subtitulo">Aún no hay perfiles. Ve a "Crear Perfil" para dar de alta el primero.</p>';
        return;
      }
      perfiles.forEach(p => {
        const tarjeta = document.createElement('article');
        tarjeta.className = 'tarjeta';
        const listo = p.estado === 'creado';
        tarjeta.innerHTML = `
          <div class="tarjeta-encabezado">
            <h3>${escaparHtml(p.username)}</h3>
            <span class="estado ${listo ? 'estado-activo' : 'estado-inactivo'}">
              ${listo ? '● Entorno listo' : '● Sin entorno'}
            </span>
          </div>
          <p class="tarjeta-desc">${ETIQUETA_ROL[p.role] || p.role} · uso de disco: ${escaparHtml(p.homeSize)}</p>
          <div class="tarjeta-acciones">
            <a class="boton boton-fantasma" href="registros.html?app=${encodeURIComponent(p.username)}">Ver registros</a>
          </div>
        `;
        contenedorTarjetas.appendChild(tarjeta);
      });
    }

    cargarPerfiles();
  </script>
</body>
</html>
